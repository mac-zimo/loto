[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loto-analyze"
version = "0.1.0"
description = "Pipeline reproductible d'analyse des tirages du Loto français"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
    "scipy>=1.11",
]

[project.optional-dependencies]
notebook = [
    "jupyter>=1.0",
    "notebook>=7.0",
]

[project.scripts]
loto-analyze = "loto.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "integration: validates the complete read-only FDJ archive set",
]
